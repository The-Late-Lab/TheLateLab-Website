name: Deploy website and playable demo
on:
  push:
    branches: [main]
    paths-ignore: [betas/arcadelab-launch/latest.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public website
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout private game
        uses: actions/checkout@v7
        with:
          repository: The-Late-Lab/Stealthmate-Tiny
          ref: main
          path: private-game
          ssh-key: ${{ secrets.STEALTHMATE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: private-game/package-lock.json
      - name: Build production game
        working-directory: private-game
        env:
          VITE_PUBLIC_BASE: /play/stealthmate/
        run: |
          npm ci
          npm run build
      - name: Assemble and audit public files
        run: node tools/assemble-site.mjs private-game/dist _site
      - name: Checkout reviewed beta game (production stays on main)
        uses: actions/checkout@v7
        with:
          repository: The-Late-Lab/Stealthmate-Tiny
          ref: a2eb8bc32bcd04daabb906c985d0876c3a58f7c7
          path: private-beta
          ssh-key: ${{ secrets.STEALTHMATE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Build unlisted beta game
        working-directory: private-beta
        env:
          VITE_PUBLIC_BASE: /play/stealthmatebeta/
        run: |
          npm ci
          npm run build
      - name: Audit and add unlisted beta
        run: node tools/assemble-site.mjs private-beta/dist _site --beta-only
      - name: Validate Arithmancer beta assembly
        run: python tools/test_assemble_arithmancer.py
      - name: Download and assemble pinned Arithmancer beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(python -c "import json; print(json.load(open('betas/arithmancer.release.json'))['release'])")
          asset=$(python -c "import json; print(json.load(open('betas/arithmancer.release.json'))['asset'])")
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/arithmancer-beta
          python tools/assemble-arithmancer.py "/tmp/arithmancer-beta/$asset" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
